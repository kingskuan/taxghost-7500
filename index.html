<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxGhost — Privacy-First Tax Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080a0f;
    --surface: #0d1117;
    --border: #1e2530;
    --accent: #00ff88;
    --accent2: #0088ff;
    --danger: #ff4466;
    --text: #e2e8f0;
    --muted: #4a5568;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 48px 0 32px;
    text-align: center;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--accent);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--accent); }

  .tagline {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .badges {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .badge.live { border-color: var(--accent); color: var(--accent); }

  /* Input section */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 32px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .input-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
  }

  .input-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  .input-row {
    display: flex;
    gap: 12px;
  }

  .wallet-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .wallet-input:focus { border-color: var(--accent); }
  .wallet-input::placeholder { color: var(--muted); }

  .analyze-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    padding: 14px 28px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .analyze-btn:hover { background: #00dd77; transform: translateY(-1px); }
  .analyze-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }

  .options-row {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .select-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }

  /* Status bar */
  .status-bar {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    padding: 10px 0;
    display: none;
  }

  .status-bar.visible { display: flex; align-items: center; gap: 8px; }

  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  #results { display: none; }
  #results.visible { display: block; }

  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 16px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .stat-card.positive { border-color: rgba(0,255,136,0.3); }
  .stat-card.negative { border-color: rgba(255,68,102,0.3); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -1px;
  }

  .stat-value.positive { color: var(--accent); }
  .stat-value.negative { color: var(--danger); }
  .stat-value.neutral  { color: var(--text); }

  /* ZK Proof box */
  .zk-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 24px;
    font-family: var(--mono);
    font-size: 11px;
    animation: fadeUp 0.5s ease both;
  }

  .zk-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .zk-verified {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
  }

  .zk-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .zk-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
  }

  .zk-row:last-child { border-bottom: none; }
  .zk-row span:last-child { color: var(--text); word-break: break-all; max-width: 60%; text-align: right; }

  /* Transactions */
  .tx-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 24px;
    animation: fadeUp 0.6s ease both;
  }

  .tx-header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr;
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .tx-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    transition: background 0.15s;
    align-items: center;
  }

  .tx-row:last-child { border-bottom: none; }
  .tx-row:hover { background: rgba(255,255,255,0.02); }

  .tx-hash {
    color: var(--accent2);
    text-decoration: none;
    font-size: 11px;
  }

  .tx-hash:hover { color: var(--accent); }

  .tx-type {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .tx-type.buy  { background: rgba(0,255,136,0.1); color: var(--accent); }
  .tx-type.sell { background: rgba(255,68,102,0.1); color: var(--danger); }
  .tx-type.transfer { background: rgba(255,255,255,0.05); color: var(--muted); }

  .tx-value { color: var(--text); }
  .tx-date  { color: var(--muted); font-size: 10px; }

  /* IPFS badge */
  .ipfs-row {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
  }

  .ipfs-link {
    color: var(--accent2);
    text-decoration: none;
    word-break: break-all;
  }

  .ipfs-link:hover { color: var(--accent); }

  /* Error */
  .error-box {
    background: rgba(255,68,102,0.08);
    border: 1px solid rgba(255,68,102,0.3);
    border-radius: 4px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--danger);
    display: none;
    margin-top: 12px;
  }

  .error-box.visible { display: block; }

  /* Footer */
  footer {
    text-align: center;
    padding: 40px 0;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  footer a { color: var(--accent2); text-decoration: none; }

  @media (max-width: 600px) {
    .input-row { flex-direction: column; }
    .tx-header, .tx-row { grid-template-columns: 1.5fr 0.8fr 0.8fr; }
    .tx-header > *:nth-child(4),
    .tx-header > *:nth-child(5),
    .tx-row > *:nth-child(4),
    .tx-row > *:nth-child(5) { display: none; }
    .summary-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">👻</div>
      <div class="logo-text">TAX<span>GHOST</span></div>
    </div>
    <div class="tagline">Privacy-First On-Chain Tax Tool</div>
    <div class="badges">
      <span class="badge live">● LIVE</span>
      <span class="badge">ZK PROOF</span>
      <span class="badge">IPFS STORAGE</span>
      <span class="badge">POWERED BY LIQUIFY</span>
      <span class="badge">ETHEREUM</span>
    </div>
  </header>

  <div class="input-section">
    <label class="input-label">// wallet address</label>
    <div class="input-row">
      <input
        class="wallet-input"
        id="walletInput"
        type="text"
        placeholder="0x..."
        value="0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
      />
      <button class="analyze-btn" id="analyzeBtn" onclick="runAnalysis()">
        Generate Report
      </button>
    </div>
    <div class="options-row">
      <select class="select-input" id="taxYear">
        <option value="2025">Tax Year: 2025</option>
        <option value="2024">Tax Year: 2024</option>
        <option value="2026">Tax Year: 2026</option>
      </select>
      <select class="select-input" id="jurisdiction">
        <option value="US">Jurisdiction: US</option>
        <option value="UK">Jurisdiction: UK</option>
        <option value="SG">Jurisdiction: SG</option>
      </select>
      <select class="select-input" id="txLimit">
        <option value="20">Limit: 20 txns</option>
        <option value="50">Limit: 50 txns</option>
      </select>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <span id="statusText">Connecting to Liquify RPC...</span>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div id="results">
    <div class="section-title">// tax summary</div>
    <div class="summary-grid" id="summaryGrid"></div>

    <div class="section-title">// zero-knowledge proof</div>
    <div class="zk-box" id="zkBox"></div>

    <div class="section-title">// recent transactions</div>
    <div class="tx-table" id="txTable"></div>

    <div class="ipfs-row" id="ipfsRow"></div>
  </div>

  <footer>
    TaxGhost — prove compliance without exposing your data &nbsp;|&nbsp;
    <a href="https://github.com/kingskuan/taxghost-7500" target="_blank">GitHub</a> &nbsp;|&nbsp;
    <a href="https://taxghost-7500-production.up.railway.app" target="_blank">API</a>
  </footer>
</div>

<script>
const BASE = 'https://taxghost-7500-production.up.railway.app';

function setStatus(msg) {
  document.getElementById('statusBar').className = 'status-bar visible';
  document.getElementById('statusText').textContent = msg;
}

function hideStatus() {
  document.getElementById('statusBar').className = 'status-bar';
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = '// ERROR: ' + msg;
  el.className = 'error-box visible';
}

function hideError() {
  document.getElementById('errorBox').className = 'error-box';
}

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
}

function fmtUSD(val) {
  if (!val || val === 0) return '$0';
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
}

function shortHash(hash) {
  return hash.slice(0, 8) + '...' + hash.slice(-6);
}

async function runAnalysis() {
  const wallet   = document.getElementById('walletInput').value.trim();
  const taxYear  = parseInt(document.getElementById('taxYear').value);
  const juris    = document.getElementById('jurisdiction').value;
  const limit    = parseInt(document.getElementById('txLimit').value);

  if (!wallet.startsWith('0x') || wallet.length < 40) {
    showError('Invalid wallet address'); return;
  }

  hideError();
  document.getElementById('results').className = '';
  document.getElementById('analyzeBtn').disabled = true;

  try {
    // Step 1: Session
    setStatus('Creating anonymous session...');
    const sessRes  = await fetch(`${BASE}/api/session`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const { sessionId } = await sessRes.json();

    // Step 2: Analyze
    setStatus('Fetching on-chain transactions via Liquify...');
    const anlRes = await fetch(`${BASE}/api/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, addresses: [wallet], chain: 'ethereum', limit })
    });
    const anlData = await anlRes.json();
    if (anlData.error) throw new Error(anlData.error);

    // Step 3: Report
    setStatus('Generating ZK tax proof...');
    const repRes = await fetch(`${BASE}/api/report`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, taxYear, jurisdiction: juris })
    });
    const report = await repRes.json();
    if (report.error) throw new Error(report.error);

    hideStatus();
    renderResults(report, anlData.transactions || []);

  } catch(e) {
    hideStatus();
    showError(e.message);
  } finally {
    document.getElementById('analyzeBtn').disabled = false;
  }
}

function renderResults(report, txns) {
  const s = report.summary;
  const zk = report.zkProof;

  // Summary cards
  const cards = [
    { label: 'Total Volume',     value: fmtUSD(s.totalVolume),          cls: 'neutral' },
    { label: 'Capital Gains',    value: fmtUSD(s.totalCapitalGains),    cls: s.totalCapitalGains >= 0 ? 'positive' : 'negative' },
    { label: 'Ordinary Income',  value: fmtUSD(s.ordinaryIncome),       cls: 'neutral' },
    { label: 'Total Taxable',    value: fmtUSD(s.totalTaxableIncome),   cls: s.totalTaxableIncome > 0 ? 'negative' : 'neutral' },
    { label: 'Transactions',     value: report.transactionCount,        cls: 'neutral' },
    { label: 'Privacy Level',    value: report.privacyLevel.toUpperCase(), cls: 'positive' },
  ];

  document.getElementById('summaryGrid').innerHTML = cards.map((c, i) => `
    <div class="stat-card ${c.cls > 0 ? c.cls : ''}" style="animation-delay:${i*0.07}s">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value ${c.cls}">${c.value}</div>
    </div>
  `).join('');

  // ZK Proof
  document.getElementById('zkBox').innerHTML = `
    <div class="zk-header">
      <div style="color:var(--muted);font-size:11px;letter-spacing:2px">ZERO-KNOWLEDGE PROOF</div>
      <div class="zk-verified"><div class="zk-dot"></div>VERIFIED</div>
    </div>
    <div class="zk-row"><span>Proof ID</span><span>${zk.id}</span></div>
    <div class="zk-row"><span>Commitment</span><span>${zk.commitment.slice(0,24)}...</span></div>
    <div class="zk-row"><span>Protocol</span><span>${zk.proof.protocol} / ${zk.proof.curve}</span></div>
    <div class="zk-row"><span>Tax Year</span><span>${zk.publicInputs.taxYear}</span></div>
    <div class="zk-row"><span>Tx Count</span><span>${zk.publicInputs.transactionCount}</span></div>
    <div class="zk-row"><span>Generated</span><span>${new Date(report.generatedAt).toLocaleString()}</span></div>
  `;

  // Transactions
  const rows = txns.slice(0, 20).map(tx => `
    <div class="tx-row">
      <a class="tx-hash" href="https://etherscan.io/tx/${tx.hash}" target="_blank">${shortHash(tx.hash)}</a>
      <span><span class="tx-type ${tx.type}">${tx.type}</span></span>
      <span class="tx-value">${tx.tokenIn} → ${tx.tokenOut}</span>
      <span class="tx-value">${fmtUSD(tx.valueUSD)}</span>
      <span class="tx-date">${fmtDate(tx.timestamp)}</span>
    </div>
  `).join('') || '<div class="tx-row" style="color:var(--muted)">No transactions found in query range</div>';

  document.getElementById('txTable').innerHTML = `
    <div class="tx-header">
      <span>TX HASH</span><span>TYPE</span><span>PAIR</span><span>VALUE</span><span>DATE</span>
    </div>
    ${rows}
  `;

  // IPFS
  document.getElementById('ipfsRow').innerHTML = `
    <span>IPFS:</span>
    <a class="ipfs-link" href="${report.ipfsUrl}" target="_blank">${report.ipfsCid}</a>
  `;

  document.getElementById('results').className = 'visible';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
